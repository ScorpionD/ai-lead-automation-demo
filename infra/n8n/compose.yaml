name: ai-lead-automation
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.6
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      private:
        ipv4_address: 172.30.240.10
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      # Owner-only instance: HTTP nodes resolve secrets from the environment.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?required}
      N8N_RUNNERS_MAX_CONCURRENCY: "2"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      N8N_LOG_LEVEL: info
      GENERIC_TIMEZONE: Asia/Tbilisi
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET:?required}
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1024m
    cpus: 0.75
    pids_limit: 192
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  runners:
    image: n8nio/runners:2.38.6
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?required}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "2"
    depends_on:
      n8n: {condition: service_healthy}
    networks: [private]
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?required}
    networks: [private]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  n8n_data:
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.240.0/24
